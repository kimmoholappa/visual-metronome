<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Visual Metronome</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d;
  --surface: #181818;
  --surface2: #222;
  --border: #2a2a2a;
  --accent: #e8ff47;
  --text: #f0f0f0;
  --muted: #666;
  --r: 12px;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }

/* ── TOP BAR ── */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 10px; }
.topbar h1 { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.btn-add { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 20px; border: none; background: var(--accent); color: #000; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }

/* ── METRO GRID ── */
.metros { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 10px; color: var(--muted); font-size: 14px; text-align: center; }
.empty-state span { font-size: 48px; }

/* ── METRO CARD ── */
.metro-card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); overflow: hidden; transition: border-color .2s; }
.metro-card.playing { border-color: #3a3a1a; }

/* two-column body */
.mc-body { display: flex; align-items: stretch; }

/* ── LEFT COLUMN (wider) ── */
.mc-left { width: 58%; flex-shrink: 0; border-right: 1px solid var(--border); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px; }

/* top row: dot · bpm · +/- */
.mc-top { display: flex; align-items: center; gap: 8px; }
.dot-area { position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dot-ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.07); }
.dot { width: 30px; height: 30px; border-radius: 50%; background: #fff; }
.dot.pulse   { animation: dp  .13s ease-out forwards; }
.dot.pulse.b1{ animation: dp1 .13s ease-out forwards; }
@keyframes dp  { 0%{transform:scale(1.7);box-shadow:0 0 20px 6px rgba(255,255,255,.45)} 100%{transform:scale(1);box-shadow:none} }
@keyframes dp1 { 0%{transform:scale(2);  box-shadow:0 0 36px 10px rgba(232,255,71,.65)} 100%{transform:scale(1);box-shadow:none} }

.bpm-group { flex: 1; display: flex; align-items: baseline; gap: 4px; }
.bpm-val { font-size: 40px; font-weight: 800; line-height: 1; cursor: text; min-width: 60px; }
.bpm-val[contenteditable]:focus { outline: none; color: var(--accent); }
.bpm-unit { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

.bpm-btns { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.bpm-btn { width: 28px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.bpm-btn:active { background: #333; }

/* beat line */
.beat-line { display: grid; width: 100%; align-items: center; }
.bl-group { display: contents; }
.bl-pip { width: 8px; height: 8px; border-radius: 50%; background: #2a2a2a; justify-self: center; }
.bl-pip.q { width: 10px; height: 10px; background: #2e2e2e; }
.bl-group { display: flex; gap: 2px; }
.bl-group + .bl-group { margin-left: 5px; }
.bl-pip { width: 8px; height: 8px; border-radius: 50%; background: #2a2a2a; flex-shrink: 0; }
.bl-pip.q   { width: 10px; height: 10px; background: #2e2e2e; }
.bl-pip.lit-q  { background: #fff; box-shadow: 0 0 5px rgba(255,255,255,.5); }
.bl-pip.lit-q.b1 { background: var(--accent); box-shadow: 0 0 7px rgba(232,255,71,.7); }
.bl-pip.lit-e  { background: #aaa; }
.bl-pip.lit-s  { background: #888; }

/* ── RIGHT COLUMN ── */
.mc-right { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 10px; gap: 6px; min-width: 0; }

.mc-header { display: flex; align-items: center; gap: 4px; }
.mc-name { flex: 1; background: none; border: none; color: var(--text); font-size: 13px; font-weight: 600; outline: none; min-width: 0; }
.mc-name::placeholder { color: #444; }
.mc-name:focus { color: var(--accent); }
.mc-del { background: none; border: none; color: #333; font-size: 12px; cursor: pointer; padding: 1px 3px; }
.mc-del:hover { color: #e74c3c; }

.mc-opts { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
select.mc-sel { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 6px; border-radius: 6px; font-size: 11px; cursor: pointer; }
.subdiv-btns { display: flex; gap: 3px; }
.sdv { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
.sdv.on { background: var(--surface2); color: var(--text); border-color: #555; }

.mc-footer { display: flex; gap: 5px; }
.btn-play { flex: 1; padding: 7px; border-radius: 7px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; background: #2a2a2a; color: var(--text); transition: background .15s; }
.metro-card.playing .btn-play { background: var(--accent); color: #000; }
.btn-tap { padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--text); font-size: 11px; font-weight: 600; cursor: pointer; }
.btn-tap:active { background: #333; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🥁 Visual Metronome</h1>
  <button class="btn-add" onclick="addMetro()">＋ New</button>
</div>

<div class="metros" id="metros">
  <div class="empty-state"><span>🥁</span>Tap <b>＋ New</b> to add a tempo</div>
</div>

<script>
let metros = JSON.parse(localStorage.getItem('vmet2') || 'null') || [
  { id: 1, name: 'Intro',  bpm: 80,  ts: 4, subdiv: 2 },
  { id: 2, name: 'Verse',  bpm: 120, ts: 4, subdiv: 2 },
  { id: 3, name: 'Chorus', bpm: 128, ts: 4, subdiv: 2 },
];
let nid = Math.max(0, ...metros.map(m => m.id)) + 1;
const rt = {};
function rtOf(id) {
  if (!rt[id]) rt[id] = { playing: false, pipIdx: -1, timerId: null, lastTaps: [] };
  return rt[id];
}
function save() { localStorage.setItem('vmet2', JSON.stringify(metros)); }

function render() {
  const el = document.getElementById('metros');
  if (!metros.length) {
    el.innerHTML = '<div class="empty-state"><span>🥁</span>Tap <b>＋ New</b> to add a tempo</div>';
    return;
  }
  el.innerHTML = metros.map(buildCard).join('');
}

function buildCard(m) {
  const r = rtOf(m.id);
  const pipsPerBeat = m.subdiv;
  let beatLineHTML = '';
  for (let b = 0; b < m.ts; b++) {
    beatLineHTML += '<div class="bl-group">';
    for (let s = 0; s < pipsPerBeat; s++) {
      const idx = b * pipsPerBeat + s;
      const isQ = s === 0, isB1 = idx === 0, isLit = idx === r.pipIdx;
      let cls = isQ ? 'bl-pip q' : 'bl-pip';
      if (isLit) cls += isQ ? (isB1 ? ' lit-q b1' : ' lit-q') : (pipsPerBeat === 4 ? ' lit-s' : ' lit-e');
      beatLineHTML += `<div class="${cls}" id="pip-${m.id}-${idx}"></div>`;
    }
    beatLineHTML += '</div>';
  }
  return `<div class="metro-card ${r.playing?'playing':''}" id="card-${m.id}">
    <div class="mc-body">
      <div class="mc-left">
        <div class="mc-top">
          <div class="dot-area"><div class="dot-ring"></div><div class="dot" id="dot-${m.id}"></div></div>
          <div class="bpm-group">
            <div class="bpm-val" id="bpmval-${m.id}" contenteditable="true"
              onblur="bpmEdit(${m.id},this.textContent)"
              onkeydown="if(event.key==='Enter'){this.blur();return false}"
            >${m.bpm}</div>
            <div class="bpm-unit">bpm</div>
          </div>
          <div class="bpm-btns">
            <button class="bpm-btn" onclick="adjBPM(${m.id},1)">+</button>
            <button class="bpm-btn" onclick="adjBPM(${m.id},-1)">−</button>
          </div>
        </div>
        <div class="beat-line" id="bl-${m.id}" style="grid-template-columns:repeat(${m.ts*m.subdiv},1fr)">${beatLineHTML}</div>
      </div>
      <div class="mc-right">
        <div class="mc-header">
          <input class="mc-name" value="${m.name}" placeholder="Name…" onchange="updateProp(${m.id},'name',this.value)" />
          <button class="mc-del" onclick="deleteMetro(${m.id})">✕</button>
        </div>
        <div class="mc-opts">
          <select class="mc-sel" onchange="updateProp(${m.id},'ts',+this.value)">
            ${[2,3,4,5,6].map(n=>`<option value="${n}" ${m.ts===n?'selected':''}>${n}/4</option>`).join('')}
          </select>
          <div class="subdiv-btns">
            ${[1,2,4].map(s=>`<button class="sdv ${m.subdiv===s?'on':''}" onclick="updateProp(${m.id},'subdiv',${s})">${s===1?'♩':s===2?'♪':'♬'}</button>`).join('')}
          </div>
        </div>
        <div class="mc-footer">
          <button class="btn-play" onclick="togglePlay(${m.id})">${r.playing?'■ Stop':'▶ Start'}</button>
          <button class="btn-tap" onclick="tap(${m.id})">👆 Tap</button>
        </div>
      </div>
    </div>
  </div>`;
}

function togglePlay(id) { rtOf(id).playing ? stopMetro(id) : startMetro(id); }

function startMetro(id) {
  const r = rtOf(id); r.playing = true; r.pipIdx = -1;
  refreshCard(id); tick(id);
}
function stopMetro(id) {
  const r = rtOf(id); r.playing = false; clearTimeout(r.timerId); r.pipIdx = -1;
  refreshCard(id);
}
function tick(id) {
  const r = rtOf(id); if (!r.playing) return;
  const m = metros.find(x => x.id === id); if (!m) return;
  fireBeat(id, m);
  r.timerId = setTimeout(() => tick(id), 60000 / m.bpm / m.subdiv);
}
function fireBeat(id, m) {
  const r = rtOf(id);
  const total = m.subdiv * m.ts;
  r.pipIdx = (r.pipIdx + 1) % total;
  const isQ = r.pipIdx % m.subdiv === 0, isB1 = r.pipIdx === 0;
  if (isQ) {
    const dot = document.getElementById('dot-' + id);
    if (dot) { dot.classList.remove('pulse','b1'); void dot.offsetWidth; dot.classList.add('pulse'); if (isB1) dot.classList.add('b1'); }
  }
  const bl = document.getElementById('bl-' + id);
  if (bl) {
    const prev = bl.querySelector('.lit-q,.lit-e,.lit-s');
    if (prev) prev.classList.remove('lit-q','lit-e','lit-s','b1');
    const pip = document.getElementById(`pip-${id}-${r.pipIdx}`);
    if (pip) { pip.classList.add(isQ ? 'lit-q' : m.subdiv===4 ? 'lit-s' : 'lit-e'); if (isB1) pip.classList.add('b1'); }
  }
}
function refreshCard(id) {
  const card = document.getElementById('card-' + id); if (!card) return;
  const r = rtOf(id);
  card.classList.toggle('playing', r.playing);
  const btn = card.querySelector('.btn-play');
  if (btn) btn.textContent = r.playing ? '■ Stop' : '▶ Start';
}
function updateProp(id, key, val) {
  const m = metros.find(x => x.id === id); if (!m) return;
  m[key] = val; save();
  const was = rtOf(id).playing;
  if (was) stopMetro(id);
  const card = document.getElementById('card-' + id);
  if (card) card.outerHTML = buildCard(m);
  if (was) startMetro(id);
}
function adjBPM(id, d) {
  const m = metros.find(x => x.id === id); if (!m) return;
  m.bpm = Math.max(20, Math.min(300, m.bpm + d)); save();
  const el = document.getElementById('bpmval-' + id); if (el) el.textContent = m.bpm;
  const r = rtOf(id); if (r.playing) { clearTimeout(r.timerId); tick(id); }
}
function bpmEdit(id, raw) {
  const v = parseInt(raw), m = metros.find(x => x.id === id); if (!m) return;
  if (isNaN(v)) { document.getElementById('bpmval-'+id).textContent = m.bpm; return; }
  m.bpm = Math.max(20, Math.min(300, v)); save();
  document.getElementById('bpmval-'+id).textContent = m.bpm;
  const r = rtOf(id); if (r.playing) { clearTimeout(r.timerId); tick(id); }
}
function tap(id) {
  const r = rtOf(id), now = Date.now();
  r.lastTaps.push(now); if (r.lastTaps.length > 6) r.lastTaps.shift();
  if (r.lastTaps.length < 2) return;
  const avg = r.lastTaps.slice(1).reduce((a,t,i)=>a+(t-r.lastTaps[i]),0)/(r.lastTaps.length-1);
  const m = metros.find(x => x.id === id); if (!m) return;
  m.bpm = Math.max(20, Math.min(300, Math.round(60000/avg))); save();
  document.getElementById('bpmval-'+id).textContent = m.bpm;
  if (r.playing) { clearTimeout(r.timerId); r.pipIdx = -1; tick(id); }
}
function addMetro() {
  const m = { id: nid++, name: '', bpm: 120, ts: 4, subdiv: 2 };
  metros.push(m); save(); render();
  setTimeout(() => {
    const card = document.getElementById('card-' + m.id);
    if (card) { card.scrollIntoView({ behavior: 'smooth' }); card.querySelector('.mc-name').focus(); }
  }, 50);
}
function deleteMetro(id) {
  stopMetro(id); metros = metros.filter(m => m.id !== id); save(); render();
}
render();
</script>
</body>
</html>
